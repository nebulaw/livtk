[workspace]
resolver = "3"
members = [
    "crates/livtk-build",
    "crates/livtk-core",
    "crates/livtk-cli",
    "crates/livtk-update",
    "crates/livtk-app",
    "crates/livtk-ui",
    "crates/liv",
    "xtask",
]
# The apps pull in a whole UI stack; plain `cargo build` and `cargo test` leave them out.
default-members = [
    "crates/livtk-build",
    "crates/livtk-core",
    "crates/livtk-cli",
    "crates/livtk-update",
    "xtask",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/nebulaw/tasks"

[workspace.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
livtk-build = { path = "crates/livtk-build" }
livtk-core = { path = "crates/livtk-core" }
livtk-update = { path = "crates/livtk-update" }
livtk-ui = { path = "crates/livtk-ui" }
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
# The terminal's events to the window; already in the tree through GPUI.
async-channel = "2.5.0"
# Waiting on two things at once (a wake or a deadline); already in the tree through GPUI.
futures-lite = "2.6.1"
# The OS's file events (FSEvents, inotify): the app waits on them instead of polling (DEC-8);
# already in the tree through GPUI.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
clap = { version = "4.6.7", features = ["derive"] }
# Mermaid diagrams in docs, drawn to SVG in pure Rust; no CLI, no PNG.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
jiff = "0.2.38"
# Where an app keeps its files, by each platform's own convention (Liv's folders).
etcetera = "0.11.0"
# Markdown split into blocks, by the parser the app's renderer uses (so the same version).
markdown = "=1.0.0"
# The app's log file; already in the tree through GPUI, which logs through it.
log = "0.4.34"
gpui-kit = "=0.7.3"
model2vec-rs = { version = "0.3.0", default-features = false, features = ["local-only", "fancy-regex"] }
# The tokenizer model2vec ships with, read by livtk's own WordPiece: the same Unicode tables as
# the `tokenizers` crate, pinned to its versions, so both tokenize alike.
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
unicode-normalization-alignments = "=0.1.12"
unicode_categories = "=0.1.1"
# `trace`: debug builds count the statements run, so tests can hold "render only reads" (DEC-7).
rusqlite = { version = "0.40.2", features = ["bundled", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package."*"]
# Dependencies need no debug info: we debug our own code, and debug info is most of the size of
# the GPUI stack (an 11 GB target directory with it).
debug = false

# The icons are made pixel by pixel (`cargo xtask icons` and its tests): built optimised even in
# debug, so a check never waits on them.
[profile.dev.package.xtask]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Model tests and benchmarks at release speed, rebuilt in seconds: no LTO, parallel codegen,
# incremental. Installed binaries keep the release profile above.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
