[package]
name = "livtk-app"
description = "The livtk desktop app: the human's view of the work, its inbox and its memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "livtk-app"
path = "src/main.rs"

[dependencies]
livtk-build.workspace = true
livtk-core.workspace = true
livtk-update.workspace = true
# The terminal view: Alacritty's emulation, scrollback, selection and PTY (Zed's is built on it).
alacritty_terminal.workspace = true
async-channel.workspace = true
mermaid-rs-renderer.workspace = true
gpui-kit.workspace = true
# Code blocks in descriptions and notes coloured by language: the tree-sitter grammars of the
# gpui-component gpui-kit is built on (and JSON, which comes with them), switched on here;
# Cargo unifies the features. A language is one more feature, at some build time and size.
gpui-component = { version = "=0.7.3", features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
jiff.workspace = true
log.workspace = true
serde.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
# The test harness, switched on in the GPUI that gpui-kit 0.7.3 is built on. gpui-kit's own
# `test-support` also pulls in its alternative gpui-fast stack, whose pinned macOS crates clash
# with this GPUI, so the feature is enabled underneath instead; Cargo unifies it.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
