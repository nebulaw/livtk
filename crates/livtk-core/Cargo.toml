[package]
name = "livtk-core"
description = "The livtk library: tasks and memory as an event log with a SQLite projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["embed"]
# Ranking by meaning with a local model2vec model. Without it, search is keywords only.
embed = ["dep:model2vec-rs", "dep:unicode-normalization-alignments", "dep:unicode_categories"]

[dependencies]
jiff.workspace = true
rustix.workspace = true
model2vec-rs = { workspace = true, optional = true }
unicode-normalization-alignments = { workspace = true, optional = true }
unicode_categories = { workspace = true, optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# To hold livtk's WordPiece to the library's tokens.
tokenizers.workspace = true

[lints]
workspace = true
