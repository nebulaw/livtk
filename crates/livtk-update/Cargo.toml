[package]
name = "livtk-update"
description = "Updates for livtk's apps: the signed manifest every update is described by, where updates come from, staging and verifying one, and the swap that rolls back"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The real HTTPS client for updates from GitHub Releases; without it, sources are read through
# `fetch::Fetch` only (tests use a fake).
http = ["dep:ureq"]

[dependencies]
minisign-verify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true

[lints]
workspace = true
