[package]
name = "livtk-update"
description = "livtk's updates: the manifest every update is described by, where updates come from, staging and verifying one, and the helper that swaps the app and rolls back"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "livtk-update"
path = "src/main.rs"

[features]
# The real HTTPS client for updates from GitHub Releases (Liv); livtk.app does without.
http = ["dep:ureq"]

[dependencies]
minisign-verify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true

[lints]
workspace = true
